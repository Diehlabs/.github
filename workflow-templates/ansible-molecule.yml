name: Ansible CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '$default-branch'
  workflow_dispatch:
  workflow_call:

jobs:
    molecule:
    name: Molecule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Setup Python 3
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: '3.x'

      - name: Install CI deps
        run: |
          pip3 install \
            ansible \
            ansible-lint \
            docker \
            molecule[docker]

      - name: Run tests
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
