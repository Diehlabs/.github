name: Ansible CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '$default-branch'
  workflow_dispatch:
  workflow_call:

jobs:
    molecule:
    name: Molecule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: Install CI deps
        run: |
          pip3 install \
            ansible \
            ansible-lint \
            docker \
            molecule[docker]

      - name: Run tests
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
